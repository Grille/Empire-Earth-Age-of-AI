; _system.ini - the system lines eeaimod shows the player (white, from nobody in particular). Not a
; personality. [system] is English; [system:de] (or :fr, :es ... - the game's language) replaces what it has.
; A key left out keeps the built-in text. Placeholders in braces are filled in; \n is a line break.
; Written by "texts dump" with the built-in texts.
;
; EXPRESSIONS: a placeholder may be an expression - {opinion > 30 ? "friend" : "neighbour"} - and [vars] names
; expressions for the texts:   address = opinion > 30 ? "friend" : opinion < -30 ? "enemy" : "neighbour"
; then "Hello dear {address}". Numbers, "texts" (or 'texts'), + - * / %, < <= > >= == !=, and or not, a ? b : c,
; ( ), pick("a", "b", ...) one at random, chance(25) true 25% of the time, min, max, abs, round. + joins texts.
; A [vars] value that is no expression is plain text (its placeholders filled). A placeholder that is no
; expression stays in the text as written, and the log (aimod_econ.csv, # texts:) says so.
; The game's values, from the one who speaks (the AI) towards the one it speaks to or about ({name}; in a system
; line the local player):
;   opinion            -100..100: what the AI thinks of them; their_opinion: what they think of it (an AI)
;   power              its strength / theirs (2: twice as strong, 0.5: half)
;   at_war, allied     1 when both are enemies / both allied; hostile, their_hostile: one side's stance
;   my_lord, my_vassal 1 when they are its lord / its vassal; vassal: it capitulated; vassals: how many it has
;   age, their_age     the epoch, 1 (Prehistoric) .. 15 (Nano) - {epoch} is its name
;   minutes            the game time
;   soldiers, citizens, buildings, towers - their_soldiers ...: counted every 10 seconds
;   kills, losses      their soldiers and citizens it destroyed / its own they destroyed
;   human              1 when they are the human player at this PC
;   aggression, loyalty, pride, greed, forgiveness, caution, talk: the AI's traits (0-100)
;   name, me, enemy    the names; language: the game's (de, en, ...)
; "texts eval P Q <expression>" (control pipe) shows what an expression gives in a running game.
;
; [vars] here serve the system lines and every personality's lines (a personality's own [vars] first);
; [vars:de] (or :fr ...) replaces them in a game of that language.
;[vars]
;mood = opinion > 30 ? "gladly" : ""

[system]
; an AI's stance towards you changed
; placeholders: {ai}
now_enemy={ai} is now your enemy.
; placeholders: {ai}
now_ally={ai} is now your ally.
; your peace offer to a vassal
; placeholders: {ai} {lord}
vassal_ask_lord={ai} is a vassal of {lord}: negotiate with {lord}.
; two members of your alliance block made peace
; placeholders: {ai} {name}
block_peace={ai} and {name} make peace: they are in the same alliance.
; placeholders: {ai}
block_unity={ai} is allied with your allies and offers peace: turn allied within 2 minutes, or the alliance breaks.
; a peace offer refused for an ally's sake
; placeholders: {ai} {ally} {name}
veto_own={ai} refuses: its ally {ally} won't make peace with {name}.
; placeholders: {ai} {name} {ally}
veto_block={ai} refuses: no peace with {name} while allied with {ally}.
; placeholders: {ai} {enemy}
alliance_offer={ai} offers an alliance against {enemy}: set {ai} to allied within 2 minutes to accept.
; placeholders: {ai} {tribute}
capitulation={ai} surrenders and offers {tribute}: set {ai} to allied within 2 minutes to accept.
; the language model's peace offer ([llm] decide)
; placeholders: {ai}
peace_offer={ai} offers peace: set {ai} to allied within 2 minutes to accept.
; placeholders: {ai} {tribute}
tribute_sent={ai} sends you a tribute: {tribute}.
; victory over vassals (the chat words 'victory' and 'sieg' stay)
victory_vassals=All remaining opponents have submitted to you. Type 'victory' in the chat to end the game as the winner - or play on.
victory_none=No opponent stands against you any more. Type 'victory' in the chat to end the game as the winner - or play on.
; placeholders: {names}
victory_not_yet=No victory yet - not submitted: {names}.
; your chat line gets no answer
chat_unread=The computer players don't read the chat (AI voice off: [llm] enabled=1 in aimod.ini).
chat_unanswered=The computer players don't answer the chat ([llm] chat=1 in aimod.ini).
; placeholders: {name}
chat_filtered=No answer: {name} doesn't get your message (chat filter).
chat_nobody=No answer: your chat filter reaches no computer player.
; placeholders: {names}
chat_who=No answer: who do you mean? Name one ({names}) or choose them in the chat filter.
; placeholders: {url}
chat_down=No answer: the language model ({url}) can't be reached.
chat_busy=No answer: the language model is too busy - try again in a moment.
; placeholders: {url} {error}
llm_down=AI voice: no answer from {url} ({error}) - the computer players say their fixed lines.
; an AI's message to another AI ([llm] ai_talk_show)
; placeholders: {name} {text}
talk_to=to {name}: {text}
; resources in a tribute ({tribute})
food=food
wood=wood
stone=stone
gold=gold
iron=iron
nothing=nothing

