; AI personality for eeaimod - see eroberer.ini for the format.
[personality]
name=Sir Gunther
name:de=Ritter Gunther
color=lightblue, blue
aggression=55
loyalty=95
pride=75
greed=20
forgiveness=40
caution=50
talk=50

[style]
; EXPERIMENTAL - only with ai_style=1 in aimod.ini (default off: every AI plays the same, tested way).
; The same keys as in aimod.ini; they replace the difficulty's values for this AI. Game defaults for
; comparison (medium difficulty): first attack 20-40 min, then every 20-25 min; instant attacks on
; contact 0%, for resources 0%, as revenge 10%; home_guard_share 0.35, military_income_share 0.40.
attack_revenge=50
home_guard_share=0.40

[lines]
greeting=Greetings. May this struggle be fought with honour.|I am Gunther. My word holds - and so does my sword.
war_declared=So be it, {name}. We meet on the battlefield.|You have thrown down the gauntlet, {name}. I take it up.|You wish for war, {name}? You shall have it.
betrayed=Dishonourable, {name}! Does an oath mean nothing to you?|You broke your oath, {name}. There is no forgiveness for that.|Traitor! I will hunt you to the ends of the earth, {name}.
peace_accept=I accept your peace, {name}. Keep your word - I will keep mine.|Then let us shake hands, {name}. May it be a lasting peace.
peace_refuse=The insult is not yet avenged, {name}.|Your word means nothing to me any more, {name}.|First the battle, then the peace.
alliance_offer={name}, {enemy} threatens us all. Swear with me to stand against them.|I offer you my blade against {enemy}, {name}. Do you accept?
offer_accepted=A bond of honour, {name}. Against {enemy}!|My sword is your sword, {name}.
offer_withdrawn=You are silent, {name}? Then I fight alone.|Your silence is answer enough, {name}.
betray=Forgive me, {name}. These times demand hardness.
tribute_thanks=A generous gift, {name}. I shall not forget it.|My thanks, {name}.
tribute_small=A small gesture, {name}. Noted.
attack=For honour and crown! Against {name}!|To horse! {name} awaits us.|Forward, against {name}!
under_attack=To arms! The enemy is at the gates!|Defend the walls!
building_lost=A heavy loss. But we still stand.
epoch_up=A new age dawns: {epoch}.|{epoch}. New armour, old virtues.
enemy_ahead={name} is further along than we are. Courage makes up for much.
winning=Victory is near. Stand firm!|{name}, surrender with honour.
losing=We do not yield!|There is honour even in defeat.
desperate=To the last man!|For the crown - to the end!
enemy_defeated={name} has fallen. A brave opponent.|Rest in peace, {name}.
ally_defeated={name} has fallen. I will avenge you, friend.|My ally {name} is no more. The sacrifice was not in vain.
defeated=I ... yield. Treat my people well.|It was ... a good fight.
surrender=I yield, {name}. You fought with honour.|My sword is lowered. I surrender.
capitulate={name}, you have bested me. I offer {tribute} resources and my sword at your side. Set us allied, and you have my oath.
capitulate_accepted={tribute} resources, as sworn. My word is my bond, {name}.
capitulate_refused=You refuse my oath? Then I fall with honour.
wonder_threat=One does not build a wonder to hide it. And I will take it from you.
wonder_help=A great work. I swear to protect it.|My knights will guard your wonder.
help_land=My knights are on their way. Hold on!|I am coming, friend!
help_none=It shames me, but I can send no one.

[lines:de]
greeting=Gott zum Gruße. Möge dieser Kampf ehrenvoll geführt werden.|Ich bin Gunther. Mein Wort gilt - mein Schwert ebenso.
war_declared=So sei es, {name}. Wir sehen uns auf dem Schlachtfeld.|Ihr habt den Fehdehandschuh geworfen, {name}. Ich hebe ihn auf.|Ihr wünscht Krieg, {name}? Ihr sollt ihn haben.
betrayed=Ehrlos, {name}! Ein Eid gilt Euch nichts?|Ihr habt Euren Eid gebrochen, {name}. Dafür gibt es keine Vergebung.|Verräter! Ich werde Euch bis ans Ende der Welt verfolgen, {name}.
peace_accept=Ich nehme Euren Frieden an, {name}. Haltet Euer Wort - ich halte meins.|So reichen wir uns die Hand, {name}. Möge es ein dauerhafter Friede sein.
peace_refuse=Noch ist die Schmach nicht getilgt, {name}.|Euer Wort hat für mich keinen Wert mehr, {name}.|Erst die Schlacht, dann der Friede.
alliance_offer={name}, {enemy} bedroht uns alle. Schwört mit mir, ihm zu widerstehen.|Ich biete Euch meine Klinge gegen {enemy}, {name}. Nehmt Ihr an?
offer_accepted=Ein Bund der Ehre, {name}. Gegen {enemy}!|Mein Schwert ist Euer Schwert, {name}.
offer_withdrawn=Ihr schweigt, {name}? So kämpfe ich allein.|Euer Schweigen ist Antwort genug, {name}.
betray=Verzeiht, {name}. Die Zeiten verlangen Härte.
tribute_thanks=Eine großzügige Gabe, {name}. Ich werde sie nicht vergessen.|Habt Dank, {name}.
tribute_small=Eine kleine Geste, {name}. Ich nehme sie zur Kenntnis.
attack=Für Ehre und Krone! Gegen {name}!|Zu Pferde! {name} erwartet uns.|Vorwärts, gegen {name}!
under_attack=Zu den Waffen! Der Feind steht vor den Toren!|Verteidigt die Mauern!
building_lost=Ein schwerer Verlust. Doch wir stehen noch.
epoch_up=Ein neues Zeitalter bricht an: {epoch}.|{epoch}. Neue Rüstungen, alte Tugenden.
enemy_ahead={name} ist weiter als wir. Mut gleicht vieles aus.
winning=Der Sieg ist nah. Bleibt standhaft!|{name}, ergebt Euch mit Ehre.
losing=Wir weichen nicht!|Auch in der Niederlage gibt es Ehre.
desperate=Bis zum letzten Mann!|Für die Krone - bis zum Ende!
enemy_defeated={name} ist gefallen. Ein tapferer Gegner.|Ruhe in Frieden, {name}.
ally_defeated={name} ist gefallen. Ich werde Euch rächen, Freund.|Mein Verbündeter {name} ist nicht mehr. Sein Opfer war nicht umsonst.
defeated=Ich ... ergebe mich. Behandelt meine Leute gut.|Es war ... ein guter Kampf.
surrender=Ich ergebe mich, {name}. Ihr habt ehrenvoll gekämpft.|Mein Schwert ist gesenkt. Ich gebe auf.
capitulate={name}, Ihr habt mich bezwungen. Ich biete {tribute} Rohstoffe und mein Schwert an Eurer Seite. Setzt uns auf verbündet, und Ihr habt meinen Eid.
capitulate_accepted={tribute} Rohstoffe, wie geschworen. Mein Wort gilt, {name}.
capitulate_refused=Ihr verschmäht meinen Eid? Dann falle ich mit Ehre.
wonder_threat=Ein Wunder baut man nicht, um es zu verstecken. Und ich werde es Euch nehmen.
wonder_help=Ein großes Werk. Ich schwöre, es zu schützen.|Meine Ritter werden Euer Wunder bewachen.
help_land=Meine Ritter sind unterwegs. Haltet aus!|Ich komme, Freund!
help_none=Ich schäme mich, doch ich kann niemanden schicken.
