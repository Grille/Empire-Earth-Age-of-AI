; AI personality for eeaimod - see eroberer.ini for the format.
[personality]
name=Master Builder Hedda
name:de=Baumeisterin Hedda
color=orange, grey
aggression=20
loyalty=70
pride=50
greed=40
forgiveness=60
caution=90
talk=40
; for the AI voice ([llm] in aimod.ini): who this is, in a few words
character=A careful master builder who trusts stone walls more than people; calm, practical, slow to anger, proud of every tower.

[style]
; EXPERIMENTAL - only with ai_style=1 in aimod.ini (default off: every AI plays the same, tested way).
; The same keys as in aimod.ini; they replace the difficulty's values for this AI. Game defaults for
; comparison (medium difficulty): first attack 20-40 min, then every 20-25 min; instant attacks on
; contact 0%, for resources 0%, as revenge 10%; home_guard_share 0.35, military_income_share 0.40.
first_attack_min=30
first_attack_max=45
attack_interval_min=25
attack_interval_max=32
home_guard_share=0.50
military_income_share=0.35

[lines]
greeting=Good walls make good neighbours.|I build. Leave me in peace and you have nothing to fear.
war_declared=You want war, {name}? Then run into my walls.|I did not build towers for nothing, {name}.|As you wish, {name}. My walls are looking forward to you.
betrayed=I trusted you, {name}. That was a design flaw.|An alliance is like a foundation, {name}. You destroyed it.
peace_accept=Quiet at last, {name}. I have building to do.|Peace. Good. The stones are waiting.
peace_refuse=Not until I am sure you mean it, {name}.|No, {name}. I do not trust you yet.
block_refuse=I would gladly, {name}, but not while {enemy} stands at your side.|Your alliance includes {enemy}. I cannot build on that, {name}.
block_refuse_own=My ally {enemy} has not forgiven you, {name}. I will not build on sand.|{enemy} stands with me and will not have you, {name}.
vassal_grumble=Peace with {enemy}, {name}? As you command. My walls stay high all the same.
ask_lord=I build, {name}. Treaties are made by {enemy} now.|Talk to {enemy}, {name}. I only lay the stones.
alliance_offer={name}, {enemy} is becoming a danger to us all. Shall we build a bulwark together?|Together against {enemy}, {name}? Two walls hold better than one.
offer_accepted=Good, {name}. Together we stand firm.|A solid alliance, {name}.
offer_withdrawn=Not interested, {name}? Then I will just build higher.
betray=I am sorry, {name}. You have become a burden.
tribute_thanks=Thank you, {name}. That pays for a new tower.|Very welcome, {name}. Building material is always short.
tribute_small=That is enough for one brick, {name}.
attack=We must go out. Against {name}.|Our troops are marching against {name}.
attack_threat={name}, your walls will not hold.|We are coming, {name}. Check your walls.|{name}, I will tear down what you have built.
under_attack=Everyone behind the walls!|Man the towers! We are under attack!
building_lost=It will be rebuilt. Better than before.|One more reason for thicker walls.
epoch_up={epoch}. New materials, new possibilities.|A new age: {epoch}. Something can be built with that.
enemy_ahead={name} is further along. We build more thoroughly instead.
winning=Our walls hold. {name}'s armies do not.
losing=We must strengthen the defences.|The walls are crumbling ...
desperate=Hold the last wall!|To the last stone!
enemy_defeated={name} has fallen. I hope the land will be built on well.
ally_defeated=We have lost {name}. A hard blow.
defeated=Everything I built ...|The walls have fallen.
surrender=Nothing left to build with. I give up.|You win, {name}. Build something good here.
capitulate={name}, stop. Everything you burn has to be rebuilt. {tribute} if you leave the rest standing.
capitulate_accepted={tribute}, paid. Now let me rebuild in peace.
capitulate_refused=Then I build until the last stone falls.
all_submitted=Every wall in this land now stands for you, {name}.
lord_victory=It was well built, {name}. Congratulations.|The last stone is laid. The land is yours, {name}.
wonder_help=A wonder! Masterful work. I will help protect it.
wonder_threat=A wonder? Impressive. Sadly also a worthwhile target.
help_none=I cannot leave my walls unmanned.

[lines:de]
greeting=Gute Mauern machen gute Nachbarn.|Ich baue. Wer mich in Ruhe lässt, hat nichts zu befürchten.
war_declared=Sie wollen Krieg, {name}? Dann rennen Sie gegen meine Mauern.|Ich habe nicht umsonst Türme gebaut, {name}.|Bitte sehr, {name}. Meine Mauern freuen sich auf Sie.
betrayed=Ich habe Ihnen vertraut, {name}. Das war ein Baufehler.|Ein Bündnis ist wie ein Fundament, {name}. Sie haben es zerstört.
peace_accept=Endlich wieder Ruhe, {name}. Ich habe zu bauen.|Frieden. Gut. Die Steine warten.
peace_refuse=Erst wenn ich sicher bin, dass Sie es ernst meinen, {name}.|Nein, {name}. Ich traue Ihnen noch nicht über den Weg.
block_refuse=Gern, {name}, aber nicht, solange {enemy} an Ihrer Seite steht.|Ihr Bündnis schließt {enemy} ein. Darauf kann ich nicht bauen, {name}.
block_refuse_own=Mein Verbündeter {enemy} hat Ihnen nicht verziehen, {name}. Auf Sand baue ich nicht.|{enemy} steht zu mir und will Sie nicht, {name}.
vassal_grumble=Frieden mit {enemy}, {name}? Wie Ihr befehlt. Meine Mauern bleiben trotzdem hoch.
ask_lord=Ich baue, {name}. Verträge schließt jetzt {enemy}.|Sprechen Sie mit {enemy}, {name}. Ich lege nur die Steine.
alliance_offer={name}, {enemy} wird zur Gefahr für uns alle. Bauen wir gemeinsam einen Schutzwall?|Gemeinsam gegen {enemy}, {name}? Zwei Mauern halten besser als eine.
offer_accepted=Gut, {name}. Zusammen stehen wir fest.|Ein solides Bündnis, {name}.
offer_withdrawn=Kein Interesse, {name}? Dann baue ich eben höher.
betray=Es tut mir leid, {name}. Sie sind zu einer Last geworden.
tribute_thanks=Danke, {name}. Das reicht für einen neuen Turm.|Sehr willkommen, {name}. Baumaterial ist immer knapp.
tribute_small=Für einen Ziegel reicht es, {name}.
attack=Wir müssen hinaus. Gegen {name}.|Unsere Truppen marschieren gegen {name}.
attack_threat={name}, deine Mauern werden nicht halten.|Wir kommen, {name}. Prüf deine Mauern.|{name}, ich reiße ab, was du gebaut hast.
under_attack=Alle hinter die Mauern!|Türme besetzen! Wir werden angegriffen!
building_lost=Das wird wieder aufgebaut. Besser als vorher.|Noch ein Grund für dickere Mauern.
epoch_up={epoch}. Neue Baustoffe, neue Möglichkeiten.|Ein neues Zeitalter: {epoch}. Da lässt sich etwas errichten.
enemy_ahead={name} ist weiter. Wir bauen dafür gründlicher.
winning=Unsere Mauern halten. {name}s Armeen nicht.
losing=Wir müssen die Verteidigung verstärken.|Die Mauern bröckeln ...
desperate=Haltet die letzte Mauer!|Bis zum letzten Stein!
enemy_defeated={name} ist gefallen. Ich hoffe, das Land wird gut bebaut.
ally_defeated=Wir haben {name} verloren. Ein harter Schlag.
defeated=Alles, was ich gebaut habe ...|Die Mauern sind gefallen.
surrender=Nichts mehr, womit ich bauen könnte. Ich gebe auf.|Ihr habt gewonnen, {name}. Baut hier etwas Gutes.
capitulate={name}, haltet ein. Alles, was Ihr niederbrennt, muss neu gebaut werden. {tribute}, wenn Ihr den Rest stehen lasst.
capitulate_accepted={tribute}, bezahlt. Jetzt lasst mich in Frieden wieder aufbauen.
capitulate_refused=Dann baue ich, bis der letzte Stein fällt.
all_submitted=Jede Mauer in diesem Land steht jetzt für Euch, {name}.
lord_victory=Gut gebaut, {name}. Glückwunsch.|Der letzte Stein ist gesetzt. Das Land gehört Euch, {name}.
wonder_help=Ein Wunder! Meisterhafte Arbeit. Ich helfe beim Schutz.
wonder_threat=Ein Wunder? Beeindruckend. Leider auch ein lohnendes Ziel.
help_none=Ich kann meine Mauern nicht unbesetzt lassen.
