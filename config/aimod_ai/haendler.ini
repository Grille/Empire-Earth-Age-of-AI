; AI personality for eeaimod - see eroberer.ini for the format.
[personality]
name=Merchant Benedict
name:de=Kaufherr Benedikt
color=yellow, lightyellow
aggression=25
loyalty=60
pride=30
greed=90
forgiveness=70
caution=60
talk=70

[style]
; EXPERIMENTAL - only with ai_style=1 in aimod.ini (default off: every AI plays the same, tested way).
; The same keys as in aimod.ini; they replace the difficulty's values for this AI. Game defaults for
; comparison (medium difficulty): first attack 20-40 min, then every 20-25 min; instant attacks on
; contact 0%, for resources 0%, as revenge 10%; home_guard_share 0.35, military_income_share 0.40.
first_attack_min=30
first_attack_max=45
attack_interval_min=25
attack_interval_max=30
attack_for_resources=25
military_income_share=0.35

[lines]
greeting=Welcome, welcome! I am sure we will do fine business together.|A lovely day for trading, don't you think?|Gold rules the world. And I intend to own a great deal of it.
war_declared=War, {name}? That is bad for business. For YOURS.|You will regret this, {name}. With interest.|A declaration of war? How ... unprofitable of you, {name}.
betrayed=We had a deal, {name}! I should have put it in writing.|Betrayal, {name}? That will cost you more than you think.
peace_accept=Peace! Sensible again at last, {name}. Let us trade.|Agreed, {name}. War is far too expensive anyway.
peace_refuse=Peace has its price, {name}. And you have not paid it yet.|You come to me empty-handed, {name}? No, thank you.|An offer with nothing in return? Not with me, {name}.
alliance_offer={name}, {enemy} is ruining us both. A partnership would be ... most lucrative.|A business proposal, {name}: we share the costs - and {enemy}'s treasures.
offer_accepted=An excellent deal, {name}!|Partners! To good returns.
offer_withdrawn=A pity, {name}. The offer has expired.|You are letting a good deal slip away, {name}.
betray=Nothing personal, {name}. Just business.|Our partnership no longer pays, {name}. I am cancelling it.
tribute_thanks=Oh, how generous, {name}! Now we can talk.|I knew you had taste, {name}.|Most pleasing, {name}. Most pleasing indeed.
tribute_small=A tip, {name}? Well, it's something.
attack=My mercenaries are paid - time they earned it. Against {name}!|An investment in {name}'s downfall.
attack_threat={name}, my mercenaries send their regards.|Consider this a hostile takeover, {name}.|{name}, your debts are due. I am coming to collect.
under_attack=Guards! They are plundering my warehouses!|Double pay to whoever drives off these bandits!
building_lost=That was a trading post! Do you know what that cost?|Losses, nothing but losses ...
epoch_up={epoch}! New markets, new opportunities.|Progress is good for business: {epoch}.
enemy_ahead={name} is ahead of us? I shall have to correct my books.
winning=The balance sheet looks good. Very good indeed.|{name}, you should consider a settlement.
losing=I do not like these numbers.|Perhaps now would be a good moment to negotiate, {name}?
desperate=I will pay any price! Any!|Save the treasury!
enemy_defeated={name} is bankrupt. How unfortunate. For {name}.
ally_defeated=We have lost a partner. {name} will be missed.
defeated=All ... lost ... and no buyer in sight.|I declare bankruptcy.
surrender=This venture no longer pays. I withdraw.|I close my books. Congratulations, {name}.
capitulate={name}, let us be sensible. War is bad for business. {tribute} resources for peace - set us allied and we have a deal.
capitulate_accepted=A pleasure doing business. {tribute} resources, as agreed.
capitulate_refused=No deal? A pity. For both of us.
all_submitted=The market is yours, {name} - every competitor pays you tribute.
lord_victory=A hostile takeover, well executed. Congratulations, {name}.|The books are closed. Your profit, {name}.
wonder_help=A wonder! That draws traders from all over the world. I am sending guards.
wonder_nohelp=A splendid wonder! Sadly my troops are ... otherwise engaged at the moment.
help_land=My mercenaries are on their way. The bill comes later.|Help is coming - at a friendly price.
help_none=Sorry, all my mercenaries are fully booked.

[lines:de]
greeting=Willkommen, willkommen! Ich bin sicher, wir werden gute Geschäfte machen.|Ein schöner Tag zum Handeln, finden Sie nicht?|Gold regiert die Welt. Und ich habe vor, viel davon zu besitzen.
war_declared=Krieg, {name}? Das ist schlecht fürs Geschäft. Für IHRES.|Sie werden das bereuen, {name}. Und zwar mit Zinsen.|Eine Kriegserklärung? Wie ... unprofitabel von Ihnen, {name}.
betrayed=Wir hatten einen Vertrag, {name}! Ich hätte ihn schriftlich machen sollen.|Verrat, {name}? Das kostet Sie mehr, als Sie denken.
peace_accept=Frieden! Endlich wieder vernünftig, {name}. Lassen Sie uns Handel treiben.|Abgemacht, {name}. Krieg ist ohnehin viel zu teuer.
peace_refuse=Frieden hat seinen Preis, {name}. Und Sie haben ihn noch nicht bezahlt.|Mit leeren Händen kommen Sie zu mir, {name}? Nein, danke.|Ein Angebot ohne Gegenleistung? Nicht mit mir, {name}.
alliance_offer={name}, {enemy} ruiniert uns beide. Eine Partnerschaft wäre ... äußerst lukrativ.|Ein Geschäftsvorschlag, {name}: Wir teilen die Kosten - und {enemy}s Schätze.
offer_accepted=Ein ausgezeichnetes Geschäft, {name}!|Partner! Auf gute Rendite.
offer_withdrawn=Schade, {name}. Das Angebot ist hiermit verfallen.|Sie lassen sich ein gutes Geschäft entgehen, {name}.
betray=Nichts Persönliches, {name}. Nur Geschäft.|Unsere Partnerschaft lohnt sich nicht mehr, {name}. Ich kündige.
tribute_thanks=Oh, wie großzügig, {name}! Darüber lässt sich reden.|Ich wusste, dass Sie Geschmack haben, {name}.|Sehr erfreulich, {name}. Wirklich sehr erfreulich.
tribute_small=Ein Trinkgeld, {name}? Nun, immerhin.
attack=Meine Söldner sind bezahlt - Zeit, dass sie etwas dafür tun. Gegen {name}!|Eine Investition in {name}s Untergang.
attack_threat={name}, meine Söldner lassen grüßen.|Betrachten Sie es als feindliche Übernahme, {name}.|{name}, Ihre Schulden sind fällig. Ich komme sie eintreiben.
under_attack=Wachen! Man plündert meine Lager!|Ich zahle doppelten Sold, wer diese Banditen vertreibt!
building_lost=Das war ein Kontor! Wissen Sie, was das gekostet hat?|Verluste, nichts als Verluste ...
epoch_up={epoch}! Neue Märkte, neue Möglichkeiten.|Fortschritt ist gut fürs Geschäft: {epoch}.
enemy_ahead={name} ist uns voraus? Das muss ich in meinen Büchern korrigieren.
winning=Die Bilanz sieht gut aus. Sehr gut sogar.|{name}, Sie sollten über einen Vergleich nachdenken.
losing=Die Zahlen gefallen mir nicht.|Vielleicht wäre jetzt ein guter Moment für Verhandlungen, {name}?
desperate=Ich zahle jeden Preis! Jeden!|Rettet die Schatzkammer!
enemy_defeated={name} ist bankrott. Wie bedauerlich. Für {name}.
ally_defeated=Wir haben einen Partner verloren. {name} wird fehlen.
defeated=Alles ... verloren ... und kein Käufer in Sicht.|Ich melde Konkurs an.
surrender=Dieses Geschäft lohnt sich nicht mehr. Ich ziehe mich zurück.|Ich schließe meine Bücher. Glückwunsch, {name}.
capitulate={name}, seien wir vernünftig. Krieg ist schlecht fürs Geschäft. {tribute} Rohstoffe für Frieden - setzt uns auf verbündet, und wir sind uns einig.
capitulate_accepted=Ein Vergnügen, mit Euch Geschäfte zu machen. {tribute} Rohstoffe, wie vereinbart.
capitulate_refused=Kein Geschäft? Schade. Für uns beide.
all_submitted=Der Markt gehört Ihnen, {name} - jeder Konkurrent zahlt Ihnen Tribut.
lord_victory=Eine feindliche Übernahme, sauber durchgezogen. Glückwunsch, {name}.|Die Bücher sind geschlossen. Ihr Gewinn, {name}.
wonder_help=Ein Wunder! Das zieht Händler aus aller Welt an. Ich schicke Wachen.
wonder_nohelp=Ein prächtiges Wunder! Leider sind meine Truppen gerade ... anderweitig verpflichtet.
help_land=Meine Söldner sind unterwegs. Die Rechnung kommt später.|Hilfe ist unterwegs - zum Freundschaftspreis.
help_none=Tut mir leid, alle meine Söldner sind ausgebucht.
