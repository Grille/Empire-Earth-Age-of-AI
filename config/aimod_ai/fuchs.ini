[style]
; EXPERIMENTAL - only with ai_style=1 in aimod.ini (default off: every AI plays the same, tested way).
; The same keys as in aimod.ini; they replace the difficulty's values for this AI. Game defaults for
; comparison (medium difficulty): first attack 20-40 min, then every 20-25 min; instant attacks on
; contact 0%, for resources 0%, as revenge 10%; home_guard_share 0.35, military_income_share 0.40.
first_attack_min=18
first_attack_max=30
attack_on_contact=20
attack_for_resources=25
attack_revenge=30

[lines]
greeting=How lovely to meet you all.|I am sure we will ... get along splendidly.|Friends? Enemies? Oh, that will sort itself out.
war_declared=How clumsy of you, {name}.|War, {name}? I had hoped you were cleverer.|Oh, {name}. You should not have done that.
betrayed=You of all people, {name}? I am almost impressed.|Betrayal is my art, {name}. You are a mere dabbler.
peace_accept=Peace, {name}? Gladly. For now.|As you wish, {name}. We are friends now.
peace_refuse=Why should I, {name}? What is in it for me?|Later perhaps, {name}. It does not suit me now.|Convince me, {name}. With gold, perhaps?
alliance_offer={name}, darling, {enemy} will devour us both. Shouldn't we ... work together?|A proposal, {name}: the two of us against {enemy}. What do you say?
offer_accepted=Wonderful, {name}. {enemy} will not like this at all.|How nice, we understand each other.
offer_withdrawn=You hesitated too long, {name}. Such a pity.|Never mind, {name}. I will remember this.
betray=I am so sorry, {name}. No, not really.|You were useful, {name}. Now you are not.|Did you really think I was your friend, {name}?
tribute_thanks=For me? How thoughtful, {name}.|You know how to treat a lady, {name}.
tribute_small=Is that all, {name}?
attack=Time for a little surprise, {name}.|Let us see how well {name} sleeps.
under_attack=How rude, to turn up unannounced!|Guards! Throw these people out!
building_lost=Annoying.|That was my favourite building.
epoch_up={epoch}. New toys.|A new age - how exciting.
enemy_ahead={name} is in a hurry? Those who run fast stumble easily.
winning={name}, you should start begging for mercy.|Everything is going to plan.
losing=Hm. That was not the plan.|Perhaps we should talk, {name}?
desperate=I am not giving up - I am merely changing tactics!|This is not over yet!
enemy_defeated=Poor {name}.|And just like that, {name} is history.
ally_defeated={name} is gone. Oh well, one finds new friends.
defeated=That ... was not ... the plan.|Very well. A game is a game.
wonder_threat=What a pretty wonder. It would be a shame if something happened to it.
help_none=Help? Me? Whatever gave you that idea?

[lines:de]
greeting=Wie reizend, dass wir uns kennenlernen.|Ich bin sicher, wir werden ... gut miteinander auskommen.|Freunde? Feinde? Ach, das ergibt sich.
war_declared=Wie ungeschickt von dir, {name}.|Krieg, {name}? Ich hatte gehofft, du wärst klüger.|Oh, {name}. Das hättest du nicht tun sollen.
betrayed=Ausgerechnet du, {name}? Ich bin fast beeindruckt.|Verrat ist meine Kunst, {name}. Du bist nur ein Stümper.
peace_accept=Frieden, {name}? Aber gern. Vorerst.|Wie du willst, {name}. Wir sind jetzt Freunde.
peace_refuse=Warum sollte ich, {name}? Was habe ich davon?|Später vielleicht, {name}. Jetzt passt es mir nicht.|Überzeug mich, {name}. Vielleicht mit Gold?
alliance_offer={name}, Liebes, {enemy} wird uns beide verschlingen. Sollten wir nicht ... zusammenarbeiten?|Ein Vorschlag, {name}: Wir zwei gegen {enemy}. Was meinst du?
offer_accepted=Wunderbar, {name}. Das wird {enemy} gar nicht gefallen.|Wie schön, wir verstehen uns.
offer_withdrawn=Du hast zu lange gezögert, {name}. Wie schade.|Dann eben nicht, {name}. Ich merke mir das.
betray=Es tut mir ja so leid, {name}. Nein, eigentlich nicht.|Du warst nützlich, {name}. Jetzt bist du es nicht mehr.|Hast du wirklich geglaubt, ich bin deine Freundin, {name}?
tribute_thanks=Für mich? Wie aufmerksam, {name}.|Du weißt, wie man eine Dame behandelt, {name}.
tribute_small=Ist das alles, {name}?
attack=Zeit für eine kleine Überraschung, {name}.|Mal sehen, wie gut {name} schläft.
under_attack=Wie unhöflich, unangemeldet zu erscheinen!|Wachen! Werft diese Leute hinaus!
building_lost=Ärgerlich.|Das war mein Lieblingsgebäude.
epoch_up={epoch}. Neue Spielzeuge.|Ein neues Zeitalter - wie aufregend.
enemy_ahead={name} hat es eilig? Wer schnell rennt, stolpert leicht.
winning={name}, du solltest langsam um Gnade bitten.|Läuft alles nach Plan.
losing=Hm. Das war so nicht geplant.|Vielleicht sollten wir reden, {name}?
desperate=Ich gebe nicht auf - ich ändere nur meine Taktik!|Das ist noch nicht vorbei!
enemy_defeated=Arme {name}. Oder armer? Egal.|Und schon ist {name} Geschichte.
ally_defeated={name} ist weg. Nun ja, man findet neue Freunde.
defeated=Das ... war nicht ... vorgesehen.|Nun gut. Gespielt ist gespielt.
wonder_threat=Was für ein hübsches Wunder. Wäre doch schade, wenn ihm etwas zustößt.
help_none=Helfen? Ich? Wie kommst du darauf?
