; AI personality for eeaimod - copy the folder aimod_ai next to Empire Earth.exe.
; Traits 0-100. Lines: variants separated by |. {name} = the player the line is about, {me} = this AI,
; {enemy} = a third player (alliances), {epoch} = this AI's age. A situation without lines stays silent.
; color = favoured player colours on random maps, first free one wins (blau, rot, gelb, lila, orange, grün, türkis,
;   dunkelrot, dunkelgrau, violett, grau, silber, hellgelb, hellgrün, hellblau, rosa - or blue, red, ... or 0-16)
[personality]
name=Khan Temur
color=dunkelrot, rot
aggression=85
loyalty=35
pride=80
greed=30
forgiveness=15
caution=25
talk=60

[style]
; EXPERIMENTAL - only with ai_style=1 in aimod.ini (default off: every AI plays the same, tested way).
; The same keys as in aimod.ini; they replace the difficulty's values for this AI. Game defaults for
; comparison (medium difficulty): first attack 20-40 min, then every 20-25 min; instant attacks on
; contact 0%, for resources 0%, as revenge 10%; home_guard_share 0.35, military_income_share 0.40.
first_attack_min=15
first_attack_max=25
attack_interval_min=10
attack_interval_max=13
attack_on_contact=40
attack_revenge=60
military_income_share=0.50
home_guard_share=0.25

[lines]
greeting=Die Steppe ist weit, aber nicht weit genug für uns alle.|Ich bin Temur. Merkt euch den Namen - ihr werdet ihn noch oft hören.|Meine Reiter sind hungrig. Wer füttert sie zuerst?
war_declared=Du wagst es, {name}? Dann lerne, was Krieg bedeutet.|Endlich, {name}. Ich hatte schon Angst, du würdest es nie wagen.|Krieg? Mit MIR? Du hast die Wahl deiner Feinde schlecht getroffen, {name}.
betrayed=Ein Verräter, {name}. Für Verräter gibt es nur eine Strafe.|Ich habe dir den Rücken zugewandt, {name}. Das war MEIN Fehler. Der nächste ist deiner.
peace_accept=Gut, {name}. Du hast Verstand. Wir reiten Seite an Seite.|Frieden also. Aber vergiss nicht, wer ihn dir gewährt hat, {name}.
peace_refuse=Frieden? Erst wenn deine Städte brennen, {name}.|Ich höre nur das Winseln eines Besiegten, {name}.|Nein. Die Steppe vergisst nicht so schnell.
alliance_offer={name}, auch du kämpfst gegen {enemy}. Zusammen zerquetschen wir ihn - danach sehen wir weiter.|{name}! {enemy} wird zu stark. Reite mit mir, und wir teilen die Beute.
offer_accepted=Gut. {enemy} soll zittern.|Ein Bündnis der Starken. So soll es sein, {name}.
offer_withdrawn=Du zögerst, {name}? Dann reite ich allein - und an dir vorbei.|Kein Bündnis also. Merk dir diesen Tag, {name}.
betray=Du bist schwach geworden, {name}. Schwäche ist in der Steppe ein Todesurteil.|Unser Bündnis ist hier zu Ende, {name}. Ich nehme mir, was ich brauche.
tribute_thanks=Ein Geschenk für den Khan? Du lernst schnell, {name}.|Das gefällt mir, {name}. Vielleicht verschone ich deine Stadt.
tribute_small=Das nennst du Tribut, {name}? Meine Pferde fressen mehr.
attack=Reiter, sammelt euch! Wir reiten gegen {name}!|Heute brennt {name}s Land.|{name}, hörst du die Hufe?
under_attack=Sie wagen es, mein Lager anzugreifen? Jeder Mann zu den Waffen!|Feinde vor dem Lager! Keiner kommt lebend zurück!
building_lost=Steine kann man wieder aufschichten. Köpfe nicht - merkt euch das.|Das wird teuer bezahlt.
epoch_up={epoch} - neue Waffen für alte Ziele.|Ein neues Zeitalter: {epoch}. Die Welt wird kleiner für meine Feinde.
enemy_ahead={name} ist uns voraus? Wir holen auf - und dann reiten wir alles nieder.
winning=Seht ihr, wie {name} wankt? Noch ein Stoß!|{name}, dein Ende ist nah.
losing=Ein Wolf ist am gefährlichsten, wenn er verwundet ist, {name}.|Lacht nur, {name}. Ich bin noch nicht fertig.
desperate=Wenn ich falle, reiße ich euch mit!|Zum letzten Ritt, Männer!
enemy_defeated={name} ist nicht mehr. So endet jeder, der sich mir entgegenstellt.|Einer weniger.
ally_defeated={name} ist gefallen. Dafür wird jemand bluten.
defeated=Die Steppe ... wird sich ... erinnern ...|Ihr habt gewonnen. Diesmal.
wonder_threat=Ein Wunder? Es wird ein wunderbares Feuer.|Was hoch steht, fällt tief.
help_land=Meine Reiter kommen!|Haltet aus, die Horde ist unterwegs!
help_none=Ich kann niemanden entbehren. Kämpf selbst.
