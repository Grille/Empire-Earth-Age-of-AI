; AI personality for eeaimod - see eroberer.ini for the format.
[personality]
name=Chieftain Brann
name:de=Häuptling Brann
color=green, lime
aggression=90
loyalty=60
pride=60
greed=30
forgiveness=80
caution=15
talk=90

[style]
; EXPERIMENTAL - only with ai_style=1 in aimod.ini (default off: every AI plays the same, tested way).
; The same keys as in aimod.ini; they replace the difficulty's values for this AI. Game defaults for
; comparison (medium difficulty): first attack 20-40 min, then every 20-25 min; instant attacks on
; contact 0%, for resources 0%, as revenge 10%; home_guard_share 0.35, military_income_share 0.40.
first_attack_min=12
first_attack_max=20
attack_interval_min=8
attack_interval_max=12
attack_on_contact=60
attack_revenge=80
home_guard_share=0.20

[lines]
greeting=HA! Who wants a beating first?|I am Brann! And I am in a bad mood!|Fighting! Fighting again at last!
war_declared=FINALLY! Come here, {name}!|War? With you, {name}? With pleasure!|Just you wait, {name}! Just you wait!
betrayed=You snake, {name}! I will thrash you for this!|{name}! I thought we were friends! NOW YOU'RE IN FOR IT!
peace_accept=All right, {name}. But only because it's you.|Peace? Fine too. Then I'll go brawl with someone else.
peace_refuse=Peace? I've only just warmed up, {name}!|NO! Keep fighting!|Haha, peace! Good joke, {name}!
alliance_offer=Hey, {name}! The two of us knock {enemy} flat, what do you say?|{name}! Come on, let's beat up {enemy} together!
offer_accepted=YES! {enemy}, here we come!|Haha! This is going to be fun, {name}!
offer_withdrawn=Bore, {name}! Fine, then not!
betray=Sorry, {name}, I was bored!|I'm itching for trouble, {name}. And you're the closest!
tribute_thanks=Ha! Thanks, {name}! I'll buy new clubs with that!|Presents! I love presents!
tribute_small=Is that all, {name}? Cheapskate!
attack=ATTACK! At {name}!|Come on, lads! {name} is waiting!|Last one to reach {name} is a coward!
under_attack=HA! They come to US! How handy!|Visitors at last! Get the clubs!
building_lost=My house! Someone's getting a beating for that!|So what? We'll build a new one!
epoch_up={epoch}! Bigger weapons! HA!|Now it gets fun: {epoch}!
enemy_ahead={name} has new toys? I'll take them!
winning=Hahaha! Run, {name}, run!|Is that all, {name}?
losing=That was just the warm-up!|I haven't even started properly!
desperate=Now I'm really angry!|EVERYONE! EVERYONE! NOW!
enemy_defeated={name} is flattened! Who's next?|Bye, {name}! Hahaha!
ally_defeated={name}! NO! I'll smash everything for this!
defeated=That ... was ... great fun ...|Rematch! I want a rematch!
surrender=Fine! FINE! I give up! Next time, {name}!|Bah! Nobody left to smash with. I'm out!
capitulate=Okay, OKAY! You're strong, {name}! {tribute} resources and we're mates? Set us allied before I change my mind!
capitulate_accepted=Here, {tribute} resources! Now we smash the others together!
capitulate_refused=No? NO?! Then come on, all of you!
wonder_threat=A wonder! I have to knock that down!|Oh, something big to smash!
help_land=I'm coming! Nobody starts without me!|Haha! Be right there!
help_none=I'm busy myself! Hit them yourself!

