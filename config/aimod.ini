; ============================================================================================
;  Empire Earth AI mod (eeaimod.dll) - settings
;  Changes take effect when a game starts (or a saved game is loaded); enabled= when Empire Earth starts.
;  This file is required: without it Empire Earth shows an error and closes. For the original game set
;  enabled=0 below, or delete eeaimod.dll.
; ============================================================================================

[general]
; 1 = the mod is active. 0 = the mod does nothing at all: the original game (no AI changes, no scenario fix,
; no display options, no personalities)
enabled=1
; Scenario fix: AIs in scenarios started from the menu play like in skirmish games
; (the original game switches most of their planning off in scenarios). 1 = on, 0 = off
scenario_ai=1
; Ranged attacks lead moving targets: arrows, bullets, cannon balls and catapult stones fly a fixed arc to where
; the target stood when they were fired, so a unit walking across the line of fire was almost never hit. They now
; aim where the target will be when they come down (its speed and direction x the flight time), for every player.
; Homing missiles are unchanged. In multiplayer every player needs the same setting. 1 = on, 0 = off (original)
lead_targets=1
; Automatic victory: 1 = the game ends by itself once one alliance is left (original). 0 = it goes on until you end
; it: once everyone still in is allied with you (vassals or allies) or nobody is left, a hint says so, and typing
; sieg / victory in the chat, Resign or Exit ends it as a victory (your allies win with you, your vassals resign).
; Players without units are still out, as in the original. Like the editor's victory flag, for every game
auto_victory=1
; Homing missiles fly towards where the target will be (intercept) instead of where it is (pursuit). Tested
; against helicopters: about the same hits and flight times - missiles are 2.5x faster than aircraft and hit
; within 1.5 tiles, so plain pursuit rarely misses. 1 = on, 0 = off (original)
lead_missiles=0
; Missile launchers (AA towers, missile troopers, ...) don't all fire at the same target: when the missiles already
; on their way will destroy it, a launcher takes another enemy of the same kind in range, or holds its shot.
; 1 = on, 0 = off (original)
spread_missiles=1
; Skip the intro movies at game start. 1 = skip, 0 = play them (original)
skip_intro=0
; Big selections: double-click (every unit of that kind on screen) and the selection box took at most 63 units.
; 1 = up to about 240 (as many as the game's selection message can carry). 0 = the original 63
big_selection=1
; AI chat lines (shown in the game's chat as the AI player): 0 = off (original), 1 = debug: the AI says what it
; decides (attacks, new epoch, extra towers, walls, siege, counter-siege, home guard), 2 = also a status line every
; 5 minutes. Rate-limited per player. chat_seconds = how long a line stays on screen
chat=0
chat_seconds=15
; AI personalities: copy the folder aimod_ai next to Empire Earth.exe. Every AI gets one of the personalities in
; it (name, favoured colour on random maps, traits for diplomacy, lines for situations of the game - see
; aimod_ai\README.md for the format). A saved game finds its personalities again by their names.
; ai_talk = 1 the AIs speak their lines, 0 silent; ai_names = 1 they take the personality's name
ai_talk=1
ai_names=1
; language of the personalities' names and lines: their [lines] are English, [lines:de] etc. replace them in a
; game of that language. Detected from the game (all 12 retail languages: de, en, fr, es, it, pl, pt-br, ru, ko,
; zh-cn, zh-tw); set it here if that fails or to choose another, e.g. language=en
;language=de
; EXPERIMENTAL: 1 = the personalities' [style] settings change how they play (earlier/later attacks, army
; share, home guard). 0 (default) = every AI plays the same, tested way; personalities only talk and negotiate
ai_style=0
; For whoever writes the texts in aimod_ai (personalities, _system.eeai, _template.eeai): 1 = every mistake comes
; up at once - the files' at startup in a message box, those found while playing (an unknown name in a condition, a
; broken expression, a placeholder nobody fills) as a line in the game. 0 (default) = a mistake is only logged
; (aimod_econ.csv, # texts:) and that key is skipped - a bad file never stops the game
strict_parsing=0
; Saved games: the mod's own state (opinions, grudges, who capitulated to whom, pending offers, army accounts)
; goes into <save name>.aimod next to the save and comes back when it is loaded. 0 = off (all of it starts
; fresh after loading)
save_state=1
; a fixed personality for one player slot (file name without .eeai), e.g.:
;personality_P2=eroberer

[camera]
; Camera scrolling (mouse at the screen edge / scroll keys):
;   ee  = original Empire Earth: constant speed
;   aoc = smooth scrolling from The Art of Conquest: starts slowly and accelerates to the same top speed,
;         with smaller, more frequent steps
scroll=ee
; Fine scrolling: the game moved the camera in fixed steps from a timer (every 10 or 25 ms) while frames come
; every few ms - some frames without a step, all steps the same size: jitter. 1 = the camera moves every frame
; by the time the frame took (same speed), 0 = the game's steps
smooth=1

[display]
; Display mode:
;   native     (0) = fullscreen (original)
;   windowed   (1) = a normal window with the resolution chosen in the game settings
;   borderless (2) = a frameless window covering the whole monitor; the game keeps its resolution and the
;                    image is scaled to the screen (aspect ratio kept, black bars if it differs). For the
;                    sharpest picture choose your monitor's resolution in the game settings.
; In windowed and borderless mode Alt+Enter switches between the two.
mode=native
; Windowed/borderless only: keep the mouse inside the window while the game is in front (edge scrolling
; without overshooting onto another monitor; leave with Alt+Tab). auto = only in borderless, free in a window
; (follows Alt+Enter); 1 = always; 0 = never. (Native fullscreen keeps the mouse anyway.)
lock_mouse=auto
; Objects drawn per frame (units, buildings, missiles - also arrows stuck in the ground). The game drew at most
; 512; in big fights and at high resolutions the farthest objects blinked out. 0 = the original 512
draw_limit=4096
; Windowed/borderless only: smooth (bilinear) scaling when the image is scaled; 0 = sharp pixels
smooth=0
; Windowed/borderless only: how the picture reaches the window. auto = the best for the installed ddraw.dll
; (DDrawCompat: through its primary surface; dgVoodoo or others: Direct3D 11), d3d = Direct3D 11,
; primary = the game's primary surface, gdi = the CPU path (use it if the window stays black or flickers)
present=auto
; Windowed/borderless only: 1 = wait for the screen refresh (no tearing, fps capped at the refresh rate),
; 0 = as fast as possible
vsync=0
; Frame watch (window modes): a line with the frame rate every minute of a game in aimod_econ.csv, and when it
; stays under this many frames per second for 10 s, a profile of where the time goes (at most 5 a session).
; 0 = off
frame_watch=35
; Own text DC: the game's GDI text goes into a memory DC of the mod instead of a DC of the DirectDraw surface.
; With DDrawCompat the surface DC makes Windows keep a font cache entry for every text output (13-22 MB a minute,
; 111 fps at the start of a game, 13 fps after 100 minutes). 0 = the game's own way
text_dc=1
; Text as textures: the game's text is drawn by the graphics card from prerendered characters (the engine's own
; bitmap fonts) instead of with GDI on the 3D image, which made the driver wait for the graphics card every frame
; (~4 ms, about half a frame at 100 fps). Needs text_dc=1. 0 = GDI text
text_bitmap=1
; Windowed/borderless only: 1 = the window uses real screen pixels at Windows display scaling of 125/150 %
; (no blur from Windows stretching it), 0 = Windows enlarges it like other old programs
dpi_aware=1

[editor]
; Resolution of the scenario editor:
;   ee   = 800x600 (original Empire Earth)
;   aoc  = 1024x768 with the editor layout of The Art of Conquest
;   game = the resolution you play games at (Game Settings), with the AoC layout extended to it: the map view
;          fills the screen, the panels sit at the bottom, minimap and file buttons at the bottom right
;   or any WIDTHxHEIGHT from 800x600 up, e.g. 1920x1080 (same layout rules)
; The background art is the original 800x600 one, stretched. Full-screen pages (players, texts) keep their
; controls at the top left, as in AoC.
resolution=ee


; --------------------------------------------------------------------------------------------
;  AI behaviour. Everything in [all] applies to every difficulty. To set something for one
;  difficulty only, put the same line into [easy], [medium] or [hard] - it wins over [all].
; --------------------------------------------------------------------------------------------
[sound]
; Sound diagnostics into aimod_econ.csv: 1 = counts of dropped sounds once a game minute, 2 = every sound played. 0 = off
log=0
; The "Max Number Of Sounds" slider goes to 200% = 32 channels, the sound mixer has 16 on current Windows: sounds on the
; missing channels stay silent (looping ones for good). 1 = hold the channels to what the mixer has (from 100% up: 16)
clamp_channels=1
; Sound channels at 100% (8..63; the slider gives 8 at 0%). The mixer's 16 are only a fallback - Windows no longer
; reports hardware voices; Miles mixes in software. 0 = keep the 16
channels=32

[llm]
; AI voice (optional): a language model on this PC speaks for the computer players - LM Studio, Ollama, llama.cpp or
; any server with the OpenAI chat API. Words only: what the AIs decide stays with the mod's rules. Start the server
; with a model loaded, then set enabled=1. Without an answer the AIs say their fixed lines.
enabled=0
; LM Studio: http://localhost:1234/v1/chat/completions   Ollama: http://localhost:11434/v1/chat/completions
url=http://localhost:1234/v1/chat/completions
; the model's name as the server lists it (LM Studio: empty = the loaded one; Ollama needs it, e.g. gemma3:12b)
model=
; the personalities' lines said in the AI's own words (1), and answers when you write to an AI in the chat (1) - name
; it ("Temur, ...") or answer the last one that spoke to you
lines=1
chat=1
; The model decides the AIs' diplomacy towards you itself (1; single player only): your peace offers, and in the
; chat it can make peace (accept yours or offer it), declare war (on an ally of 5+ minutes) or send you a tribute
; (at most a quarter of its stock) - the model must support tool calls. What isn't possible (fixed teams, its pride
; after your declaration, an ally's veto, a vassal - constrained) is never offered to it; no answer: fallback.
; 0 = words only, the rules decide everything
; with decide=1 the rules' own moves towards you - an alliance offer, a betrayal, a capitulation, a rebellion -
; are put to the model first: it makes them in its own words, or declines (you never learn of it); no answer: the
; rules go ahead
decide=0
; The AIs talk to each other (1; single player): a line one AI says to another (war, betrayal, an alliance offer, a
; capitulation) opens an exchange of up to ai_talk_turns messages (4; any number - an AI may end it sooner with [end]),
; each pair with its own memory. Words only. At most
; one exchange every ai_talk_gap seconds (10+); yours go first. ai_talk_show=1: you read along ("to <name>: ..."),
; 0: only in the log
ai_talk=0
ai_talk_show=1
ai_talk_gap=60
ai_talk_turns=4
; The model decides between the AIs too (1; single player, not with fixed teams): an alliance offer or a capitulation
; from one AI to another is answered by the other's model, and in their talks an AI may offer peace, declare war on an
; ally (5+ minutes) or send a tribute. The rules say what is possible and decide when the model doesn't answer
ai_decide=0
; What the model may do when it decides (decide, ai_decide): 1 = within the rules - no peace while its pride holds
; after a declaration of war or an ally vetoes it, war only on an ally of 5+ minutes and never on its lord, no
; diplomacy of its own as a vassal, a tribute every 3 minutes of at most a quarter of each resource. 0 = only the
; game limits it: peace and war whenever it likes (a vassal may rebel against its lord), a vassal answers peace
; offers itself, tributes of all it has - for capable models; expect surprises
constrained=1
; what each AI remembers of its talk with you, and each pair of AIs of theirs: the last <memory> chat lines, answers
; and events, in order (8; 0 = nothing; more = longer requests - small models get slower and lose track). Kept in
; saved games
memory=8
; pair = a memory for the talk with you and one for each pair of AIs (each knows only what was said there);
; player = one memory per AI: all it said and heard - with you and with every AI - and its events, in order (it
; knows what it told the others and may keep it or share it; longer requests - set memory higher, e.g. 64)
memory_mode=pair
; the model isn't told who is human: you are "another leader in this game" like every AI (1), or the human player (0)
equal=0
; seconds a line may wait for the model (2..120), else the fixed line
timeout=20
; When the model can't be reached or hasn't answered within timeout: rules = the computer players say their fixed
; lines and the rules decide; pause = the game pauses until it answers (tried again every 5 s; resume the game
; yourself to play on - the answers still come). Single player only
fallback=rules
; answer length (tokens, 16..8000; 300 is plenty for one or two sentences - more only with think=1) and temperature x100
max_tokens=300
temperature=80
; Reasoning models think before they answer: 0 = asked not to ("reasoning_effort":"none" - answers in seconds; a server
; that doesn't know the field gets requests without it), 1 = let them think (much slower; needs more max_tokens)
think=0
; extra JSON fields for the request (e.g. "top_p":0.9)
extra=
; for a server that wants a key (a local one doesn't)
api_key=
; prompts and answers into aimod_econ.csv (# llm:)
log=1

[all]

; Resource discount: what the AI pays, in percent of the real price.
;   100 = fair (same prices as you), 75 = a quarter cheaper, 50 = half price.
;   0   = don't touch it: use the game's "Cheat" setting (scenario editor / data files).
cost_percent=100

; Early-game economy plan (before farms, which arrive in the Copper Age):
; the AI builds up its economy, counts the food it can find, saves for the next epochs,
; keeps only a token army and advances as soon as it can pay. 1 = on, 0 = original behaviour
copper_plan=1

; Military budget: soldiers may only be paid from a share of the AI's starting stock and of
; everything it gathers; the rest goes into economy and epochs. 1 = on, 0 = original behaviour
budget=1
; share of the starting stock / of all income that may go into the army (0.0 - 1.0)
military_start_share=0.30
military_income_share=0.40
; from the Copper Age on (farms: food no longer runs out) a player puts most of his income into the army
military_income_share_farms=0.65

; Epoch pacing from the Copper Age on (before that the economy plan advances when it can pay):
;   timer = wait epoch_min..epoch_max minutes between epochs (original game: 50 - 70; the game
;           still scales this a little by difficulty)
;   fast  = advance as soon as the next epoch can be paid
epoch_pacing=timer
epoch_min=50
epoch_max=70

; Wait for the player: 1 = the AI never advances past the highest human player's epoch
; (original behaviour - lets you set the pace), 0 = the AI ignores the human players' epochs (its own epoch timer
; above still sets the pace). [easy] below sets 1.
wait_for_player=0

; --- Attacks ---  (remove the ';' to use a line; without it the original value applies)
; minutes until the first attack (original 20 - 40)
;first_attack_min=20
;first_attack_max=40
; minutes between regular attack waves (original 14 - 17; the game scales this by difficulty)
; suggestion below: fewer but bigger waves - in tests the AIs kept ~20% more workers
attack_interval_min=20
attack_interval_max=25
; size of an attack group in percent (original: easy 80, medium 110, hard computed)
attack_group_percent=150
; chance in percent of an extra, immediate attack - the source of many small, wasted waves:
;   on contact with an enemy (original 71), to take an enemy's resources (original 20),
;   out of revenge when attacked (original 10). 0 = never.
attack_on_contact=0
attack_for_resources=0
;attack_revenge=10

; --- Attack routing --- (only enemy buildings the AI has actually seen count; no map knowledge)
; Armies march around known enemy towers instead of straight through them. 1 = on, 0 = original routes
avoid_towers=1
; Experimental: if the goal of an attack lies inside known tower range, attack an undefended enemy
; building nearby instead (the economy behind the towers, the open flank). 1 = on, 0 = off
attack_weak_spots=1
; Soldiers on an attack don't take on enemies standing inside known tower range (defenders waiting next to
; their towers would draw the whole army in) - unless the attack's goal is in there anyway. 1 = on, 0 = off
attack_leash=1
; When the way to the goal crosses a known enemy wall, break through it away from the towers instead of piling up
; in front of it. 1 = on, 0 = off
attack_breach=1
; Soldiers on an attack ignore enemy aircraft out of their reach (their range + 3 tiles): they chased the
; player's planes circling over their own town and the whole attack waited for them (6+ minutes at its docks on the
; reference save). In reach they still shoot. 1 = on, 0 = off (the original)
attack_ignore_air=1
; What the AIs know. The game shows them every unit of a human player, everywhere and always (measured: a rifleman
; alone at the map edge, far from every AI unit, counts as seen). 0 = the mod uses that as the game has it (all-knowing
; about the human). 1 = honest: an AI knows only what its units (and its allies') see now, remembers what it saw -
; buildings until it looks again and they are gone, soldiers for 10 minutes where it saw them - and assumes a quarter
; of the army it knows of at a place it hasn't looked at for 3 minutes; a landing's warships look at the beach first.
; The memories are saved with the game. (The game's own AI code still sees everything either way.)
honest_vision=1
; Citizens, enemy towers and raiders: the AI no longer sends citizens to resources inside the range of enemy towers
; it has seen, past them on the way from its drop site, or where enemy soldiers stand (6 tiles), and calls back
; those already working there. 1 = on
avoid_towers_citizens=1
; Citizens fight back: they attack the enemy citizens building a tower near them (any age) and, up to the Bronze Age,
; small groups attacking them - only when clearly stronger (3x hit points x attack). 1 = on
citizen_militia=1
; Experimental: the citizens decide with the fight estimate instead, in every age - as a fallback when no soldiers
; near would win, unguarded builders when they win, soldiers only when they win clearly or are caught by faster
; units and still win. 0 = off (default)
militia_estimate=0
; Citizens keep away from what hurts them: artillery and ships at their full reach (up to 27 tiles), and spots where
; citizens were hit in the last 2 minutes (artillery firing from the fog, aircraft where they strike) - food and wood
; are left after one hit nearby, stone, gold and iron (worth some risk) after three. 1 = on
citizen_threats=1
; Fortresses (Copper Age, 350 wood, hold 40 units off the map): citizens under fire go into one nearby and come out
; when it is quiet; the AI builds one at its main drop site once enemy aircraft are possible or citizens get hurt
; (a second from 40 citizens). 1 = on
bunkers=1
; ... and a reserve outside the population limit (units in a fortress don't count): with the map full, idle soldiers
; at home go in so training goes on; they come out after losses or when enemies come near. A mask of players
; (65535 = all, 0 = off)
bunker_reserve=65535
; Siege weapons like a player: they shell known enemy towers (that they outrange) and the walls to breach from a
; safe distance, while idle soldiers guard them; the AI builds a Siege Factory and trains 2-4 siege weapons of its
; epoch when it knows enemy defences (with priority on the stock above the epoch reserve); rams don't attack
; buildings guarded by enemy soldiers. 1 = on, 0 = off
attack_siege=1
; advanced: route cost per tower (a normal step costs 10-14), extra tiles kept from a tower's range,
; search radius (tiles) around the original goal for a weak spot
;avoid_towers_weight=2000
;avoid_towers_margin=6
;attack_weak_spot_radius=60

; Safe sites (experimental): citizens only gather near their base, on routes away from known
; enemies. Saves workers on crowded maps, but slows mining (gold/iron) on open maps. 1 = on
safe_sites=0

; Build queue fix: the game's build list for random maps starts with a settlement it can never place, which
; blocks every later building (granary, archery range, stable, siege factory...) for the whole game. It is
; built as a normal Settlement, and a building that can't be placed 3 times in a row is skipped. 1 = on
build_fix=1
; Farm fields: the game's AI left the fields around its granary as bare foundations (always on maps with fish,
; often on land), put nobody on finished ones and never replaced destroyed ones. The AI builds them as far as
; its wood pays (50 a field; unit training leaves that wood alone), puts a farmer on every finished field and
; lays out lost fields again. 1 = on
build_fields=1
; Paid upgrades: on reaching an epoch the game's AI got all unit and tower upgrades of that epoch for free, on the
; spot. It now researches them at their buildings and pays, like a player. 1 = on
paid_upgrades=1
; More granaries: the game's AI builds a single granary (8 fields), so its food stays short and the citizens it
; can't put on food go to gold. It asks for another one when the food workers are 6+ below the target and every
; field is farmed (about one per 8 wanted food workers, at most 8). 1 = on
more_granaries=1
; Mines near a drop site: citizens mine at the free mine closest to a Town Center, Capitol or Settlement
; instead of the first one the game finds (often far away). 1 = on
mine_choice=1
; Move workers from a resource with far more workers than it needs to stone, gold or iron mines that are
; short (the game only ever reassigns idle citizens). 1 = on
rebalance_workers=1
; Research the gathering upgrades (Hand Axe, Hafts, ...) as soon as they are available - the game's AI
; rarely gets to them. 1 = on
gather_research=1
; Defences like a player: towers in a line facing the nearest known enemy (and at outlying settlements)
; instead of scattered, extra towers while stone allows, and a wall in front of the towers. 1 = on
defence_layout=1
defence_towers=1
defence_walls=1
; tiles from the base centre to the tower line
;defence_distance=10
; Soldiers near the base attack enemy siege weapons shelling it - only when clearly stronger than the escort.
; 1 = on
counter_siege=1
; Anti-air: when the AI sees enemy aircraft over its towns, it builds AA guns next to them and trains AA units
; (2 + half the aircraft seen, at most 16; replaced when lost). 1 = on
anti_air=1
; ... and ahead of time: from World War I, once an enemy is there too, AA guns at its main drop sites and 2 AA units
; before any aircraft come (getting them up while the town is bombed is too late); aircraft seen anywhere count.
; 1 = on; aa_ahead_buildings = how many drop sites get one
aa_ahead=1
aa_ahead_buildings=3
; Hold the town (experimental): when a stronger enemy army camps near an AI town, its soldiers pull back behind the
; town and guard there instead of chasing it one by one (Guard behaviour), and strike together once they are 1.3x
; its strength. Tests against a camp that pushes and pulls back like a player: worse (the town is left to the
; pushes - fewer citizens, Town Center lost more often). 1 = on, 0 = off (default)
hold_town=0
; Attack retreat (experimental): an attack in the enemy town that has lost half its strength, or faces 1.5x its
; strength twice in a row, is called back home and the next one comes within 5 minutes. 1 = on, 0 = off (default)
attack_retreat=0
; When the AI asks for a soldier it can't pay for or train (heroes, units of an earlier age, gold units without
; gold), it trains the strongest soldier it can afford instead. 1 = on
unit_substitution=1
; ... but a unit it can train and only can't pay yet is saved for first: this many seconds without a requested
; soldier before it trains a substitute (at once with enemy soldiers in its base). 0 = substitute at once
substitute_wait=90
; The mod's own training orders (AA units, siege, home guard, transports) only up to the room under the population
; cap - at the cap they were paid for and stuck in the queue, blocking the AI's own training. A mask of players
; (65535 = all, 0 = off)
train_room=65535
; Wood after the Copper Age: the game's food demand never shrinks, so wood got 1-3 workers and nothing was built.
; 1 = wood gets the workers that close its gap (what the AI wants to build and train - ships too - beyond its stock)
; within about 2 minutes, and no more: a pile of wood buys nothing; 2 = surplus workers are moved to wood too;
; 4 = workers the farms can't take go to stone, gold and iron (the army's metals) instead of piling wood or food;
; 8 = while 4000+ food lie beyond the age reserve, farmers move to the metals (fields stand idle; off by default:
;     a bigger army in a long game, but in AI-only tests the AIs survived less often, 70% vs 78%);
; 16 = metal pull: when the army's orders fail for gold/iron/stone (more than for food) and food is above its
;     reserve, farmers move to the metals, 2 every 10 s (back 4 at a time when food runs short) - the game gives
;     gold and iron 1-6% of the workers next to its phantom food demand (off by default until tested);
; 7 = 1+2+4 (default), 31 = all, 0 = none (the original)
late_targets=7
; Home guard: the AI keeps 6 + this many soldiers per age at home (it only trained for its next attack). 0 = off
home_guard=4
; ... and at least this share of its room for soldiers (population cap x (1 - citizen share)) - grows with the cap
home_guard_share=0.35
; Muster: when an enemy army in the base is hopeless to fight (at least 8 soldiers, twice the strength of the AI's
; soldiers and towers there), the AI no longer feeds its soldiers in one by one: they gather 18 tiles beyond the
; base and strike together once 1.3 x as strong; citizens next to the enemy flee there too (around the enemy, not
; through it). 0 = off
muster=1
; Citizen attacks: an AI that can't train soldiers still launched its attacks on time - with citizens, who walked
; into the enemy's army and towers. An attack group of at least half citizens is called off. 1 = allowed (original)
citizen_attacks=0
; Answer war: whoever declares war on an AI that is allied with them gets war back a few seconds later, with the
; stance line (stance_lines), a revenge attack and a taunt (the original AI has no diplomacy and stays allied). 1 = on
answer_war=1
; Stance lines: 1 = only an AI's stance changes towards you, naming it ("<AI> is now your enemy / ally");
; 2 = the game's line for every AI stance change, also between AIs (it doesn't say towards whom); 0 = none
stance_lines=1
; AI diplomacy: AIs judge peace offers (opinion, power, grudge, tribute - per personality), offer alliances against
; a much stronger enemy and may betray a weak ally (disloyal personalities). Not in scenarios or with locked teams.
; An alliance offered to you is only a message: the AI stays at war until you set it to allied (offer_minutes).
; An AI that is clearly losing to an attacker offers him peace and tribute (capitulation; set it to allied to
; accept). A vassal (capitulated, still allied with its lord) has no diplomacy of its own: it sends peace offers to
; its lord and makes none itself - a disloyal, proud one rebels once it is clearly stronger than its lord.
; Breaking an alliance costs reputation with every AI (by its loyalty; attacking
; one's own vassal x3, right after accepting its capitulation x5). Peace offers are always judged; 0 switches off
; only the AIs' own initiative
ai_diplomacy=1
; How long an offer to you stands - an alliance, peace, a capitulation - before it runs out (minutes, 1+)
offer_minutes=2
; Alliance blocks (with ai_diplomacy): everyone linked by alliances is one block, and inside a block there is peace -
; two AIs allied with the same player make peace with each other; an AI at war with you that joins your block
; offers you peace (offer_minutes to accept). Whoever turns on a member splits the block: every other AI takes a side
; (the one it capitulated to, else its direct ally, else the one it likes better - the attacked a bit more) and a
; traitor betrays the victim's whole block. Joining means peace with the whole other block: an AI refuses when it
; or one of its allies holds a grudge (a war declared recently, opinion below -30) against a member of the other
; side, and names who stands in the way. A vassal has no say when its lord is part of the deal (it grumbles).
; 1 = on, 0 = off (alliances only between two players)
alliance_blocks=1
; Surrender: an AI that has lost all its citizens and can't train new ones (no Town Center or nothing to pay with)
; resigns after a minute - or after 3 minutes without citizens in any case - instead of leaving its last buildings
; to be hunted down. Not while its army still has half the strength of its strongest enemy; not in scenarios. 1 = on
surrender=1

; Landings: the AI plans a landing behind your lines across the sea - the weakest defended beach next to your
; buildings, warships ahead, its transports gather and run in together, a bridgehead with towers and a forward base,
; then waves. landing_transports = the most transports (the size follows the beach), landing_citizens = citizens
; for the forward base, landing_waves = waves after the first. 1 = on
landing=1
landing_transports=8
landing_citizens=10
landing_waves=3

; --- Experimental (off by default) ---
; The mod leads the AI's land attacks itself (rally, objectives, waves) - worse than the game's own in every test
assault=0
; The defence decisions (muster, hold the town, attack retreat, militia) compare sides with the fight estimate
; (range, minimum range, area damage, the game's damage tables) instead of hit points x attack - no gain in tests
fight_estimate=0

; --- advanced tuning (same for all difficulties) ---
; workers the AI grows to before it starts saving for the early epochs
min_workforce=40
; Epoch requirements: besides the cost, an epoch needs two "new things" of the current one (a new unit type,
; building or tech). The AI asked for them only once it could pay, and often picked unbuildable decoration
; (statues) - it waited 4-14 minutes. 1 = ask early, never decoration, requirement units past the army budget
early_requirements=1
; Reserve plan (from the Copper Age on): hold back for the next epoch only what can't be gathered again in time -
; food spent now while gold and iron are still missing grows back on the farms. 1 = on
reserve_plan=1
; before the Copper Age: citizens on stone, gold and iron only for the epoch costs + this much for the army
; (else they sat on 1000 iron while the Stone Age waited for food); -1 = follow the army's demand
mineral_worker_margin=300
; share of the wild food it has found (berries) the AI counts on gathering
wild_food_share=0.6
; food above the epoch reserve + this amount may always go into the army (no endless hoarding)
hoard_cap=3000
; the same for stone, gold and iron (hardly any civilian use besides the epoch cost, which is reserved anyway) -
; 600 kept ~600 iron lying while the army failed for iron hundreds of times every 5 minutes
hoard_cap_mineral=200
; share of the population cap for citizens (game default 0.45, the rest is for the army); 0 = game default
;citizen_share=0.45
; Population limit of the AIs: 0 = the game limit, the same as yours (the AI at its strongest); 1 = follows the
; humans (original): 0.8 x the largest human population + 0.2 x the game limit, x 70% / 90% / 140% (easy / medium /
; hard) - the AI grows with you and doesn't flood you with units. Per difficulty: [easy] below sets 1.
pop_follow_human=0
; from the Copper Age on: minutes before a planned epoch advance in which the AI starts saving
reserve_window_min=5
; distance (tiles) for safe sites
site_max_distance=20


[easy]
; the population limit follows the humans, and the AI doesn't get ahead of your epoch (see [all])
pop_follow_human=1
wait_for_player=1
; examples - remove the ';' to use:
; cost_percent=100
; epoch_pacing=timer

[medium]
; cost_percent=100

[hard]
; e.g. a harder opponent that pays less and keeps a bigger army:
; cost_percent=75
; military_income_share=0.55
