[autotest]
skip_intro=1
; quit after this many game minutes (0 = never)
quit_minutes=75
; game speed: normal = 2.5. Up to 7.5 the simulation step stays normal (3x faster, same behaviour);
; 10+ enlarges sim steps (movement artifacts). Same speed = byte-identical, reproducible runs.
speed=7.5
; AI diplomacy initiative (alliances, betrayal) off, so AI-vs-AI results stay comparable; -IniExtra ai_diplomacy=1 to test it
ai_diplomacy=0
